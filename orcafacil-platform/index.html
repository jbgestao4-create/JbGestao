<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>ControleSoft</title>
  </head>
  <body style="margin: 0; background: #0b0f19;">
    <div id="root">
      <div id="brand-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f19;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;z-index:99999;user-select:none;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;width:96px;height:96px;margin-bottom:20px;">
          <div style="position:absolute;inset:0;border:3px solid rgba(59,130,246,0.2);border-top-color:#3b82f6;border-radius:50%;animation:cs-spin 1s linear infinite;"></div>
          <div style="position:relative;width:56px;height:56px;background:#ffffff;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,0.35);">
            <img src="/controlesoft-mark.png" alt="ControleSoft" style="width:100%;height:100%;object-fit:contain;" />
          </div>
        </div>
        <div style="font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#f1f5f9;margin-bottom:4px;">ControleSoft</div>
        <div style="font-size:12px;color:#94a3b8;animation:cs-pulse 1.5s ease-in-out infinite;">Carregando sistema...</div>
      </div>
      <style>
        @keyframes cs-spin { to { transform: rotate(360deg); } }
        @keyframes cs-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
